<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#10131b;--s1:#171b26;--s2:#1e2332;--line:#2a3042;--t:#eef1f7;--t2:#aab1c2;--t3:#7b8397;--blue:#4c8dff;--p:#3ecf8e;--a:#ff7a7a;--l:#f5b74e;--e:#a78bfa;--kga:#5aa9ff;--kgb:#ff8fb1;--prepa:#7ee0b5;--prepb:#ffc36b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:15px/1.4 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden;display:flex}
.rail{width:220px;background:#0c0f16;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex:none}.rail h3{color:var(--blue);font-size:18px;padding:0 8px}.rail small{color:var(--t3);padding:0 8px 14px}.rail a{padding:10px 12px;border-radius:10px;color:var(--t2)}.rail a.on{background:var(--s2);color:var(--t)}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
.dock{position:absolute;bottom:0;left:0;right:0;height:72px;background:#0c0f16;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;color:var(--t3);font-size:12px;z-index:9}.dock b{display:block;text-align:center;font-size:20px}.dock .on{color:var(--blue)}
.top{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}.top h1{font-size:21px;font-weight:650;flex:1}.top .ct{font-size:15px;color:var(--t2);font-variant-numeric:tabular-nums}.ib{width:38px;height:38px;border-radius:11px;background:var(--s1);display:grid;place-items:center;color:var(--t3)}
.bar{margin:0 18px 10px;height:5px;border-radius:9px;background:var(--s2);overflow:hidden;display:flex}.bar i{height:100%}
.seg{margin:0 18px 8px;display:flex;background:var(--s1);border-radius:11px;padding:3px}.seg span{flex:1;text-align:center;padding:6px;border-radius:9px;font-size:13px;color:var(--t3)}.seg .on{background:var(--s2);color:var(--t)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#10131b}
.sh{display:flex;align-items:center;gap:10px;padding:12px 18px 8px}.sh b{font-size:14px;font-weight:650;letter-spacing:.03em}.sh small{color:var(--t3);font-size:12px}.sh .all{margin-left:auto;font-size:13px;font-weight:650;padding:6px 12px;border-radius:99px;color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}.sh .all.done{color:var(--t3);background:var(--s1)}
.list{display:flex;flex-direction:column;padding:0 14px}.r{display:flex;align-items:center;gap:12px;position:relative}.r .n{flex:1;min-width:0}.r .n b{font-weight:600}.r .n small{display:block;color:var(--t3);font-size:12px}
.pill{font-size:12px;font-weight:650;padding:4px 11px;border-radius:99px}
.tag-P{color:var(--p);background:color-mix(in srgb,var(--p) 15%,transparent)}.tag-A{color:var(--a);background:color-mix(in srgb,var(--a) 15%,transparent)}.tag-L{color:var(--l);background:color-mix(in srgb,var(--l) 15%,transparent)}.tag-E{color:var(--e);background:color-mix(in srgb,var(--e) 16%,transparent)}.tag-{color:var(--t3);border:1px dashed var(--line)}
.lab{position:absolute;right:12px;bottom:${0}px}
.pane{width:360px;flex:none;border-left:1px solid var(--line);background:#131722;padding:22px;display:flex;flex-direction:column;gap:14px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.btns div{height:48px;border-radius:12px;display:grid;place-items:center;font-weight:650;font-size:14px;background:var(--s1);color:var(--t2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--s2);color:var(--t2)}.chips .on{background:color-mix(in srgb,var(--e) 25%,transparent);color:var(--t)}
.cap{font-size:11px;letter-spacing:.1em;color:var(--t3);text-transform:uppercase}

.card{border-radius:18px;background:var(--s1);padding:12px;display:flex;gap:12px;align-items:center;margin:0 14px 10px}
.ph{width:64px;height:64px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:30px}
.steps{display:flex;gap:3px;margin-top:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--s2)}
.src{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--t2)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s2);border-radius:24px 24px 0 0;z-index:21;padding:14px 20px 26px;display:flex;flex-direction:column;gap:12px}
.scrim{position:absolute;inset:0;background:#0009;z-index:20}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.fld{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:12px;background:var(--s1);font-size:14px}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}.cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.in{height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line);padding:12px;color:var(--t2);font-size:14px}
.circ{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:650}.circ div{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 20px #0009}
</style></head><body><div class="main" id="m"></div><script>
const q=new URLSearchParams(location.search),S=q.get('s'),W=q.get('w')==='wide'
const col={'KG A':'var(--kga)','KG B':'var(--kgb)','PREP A':'var(--prepa)','PREP B':'var(--prepb)'}
const av=(n,s,z=44)=>`<div class="av" style="width:${z}px;height:${z}px;font-size:${z*.34}px;background:${col[s]}">${n.slice(0,2).toUpperCase()}</div>`
const ring=(m,t,c,z=34)=>{const r=z/2-4,C=2*Math.PI*r;return `<svg width="${z}" height="${z}"><circle cx="${z/2}" cy="${z/2}" r="${r}" stroke="#2a3042" stroke-width="4" fill="none"/><circle cx="${z/2}" cy="${z/2}" r="${r}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C*m/t} ${C}" transform="rotate(-90 ${z/2} ${z/2})"/></svg>`}
const ST={'Measured':'var(--blue)','At maker':'var(--l)','Fitting':'var(--e)','Ready':'var(--p)','Ordered':'var(--blue)','Arrived':'var(--l)','Issued':'#5ad1c8','Needs fixing':'var(--a)'}
const pill=(t,on)=>`<span class="pill" style="padding:7px 11px;font-size:13px;${on?`background:${ST[t]||'var(--blue)'};color:#10131b`:`color:${ST[t]||'var(--t2)'};background:color-mix(in srgb,${ST[t]||'#888'} 13%,transparent)`}">${t}</span>`
const tag=t=>`<span class="pill" style="color:${ST[t]};background:color-mix(in srgb,${ST[t]} 16%,transparent)">${t}</span>`
const tint=t=>`color-mix(in srgb,${ST[t]} 12%,var(--s1))`
const head=(sub,right='')=>`<div class="top"><h1>Costumes</h1>${right}<div class="ib">↶</div><div class="ib">⚙</div></div>${sub}`
const tog=a=>`<div class="seg"><span class="${a?'on':''}">By item</span><span class="${a?'':'on'}">By child</span></div>`
const filt=c=>`<div style="display:flex;gap:6px;padding:0 18px 10px;flex-wrap:wrap">${c.map((x,i)=>`<span class="pill" style="padding:6px 12px;${i?'background:var(--s1);color:var(--t2)':'background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--t)'}">${x}</span>`).join('')}</div>`
const dock=`<div class="dock"><span><b>☀</b>Register</span><span class="on"><b>🎭</b>Show</span><span><b>👥</b>Singers</span><span><b>📝</b>Notes</span><span><b>📊</b>Reports</span></div>`
const ITEMS=[['🧥','Red cape','#e05a5a','Tailor',9,12,'Fitting',['Mila','Theo','Ava']],['🎀','Gold sash','#e0b24c','Bought',12,12,'Ready',[]],['👑','Paper crown','#c9a6ff','Made at home',4,10,'At maker',['Noor','Leo','Rhea','Omar']],['👟','White shoes','#9fb3c8','Rented',6,18,'Ordered',['Neel','Sana','Eli']],['🌻','Sunflower dress','#f5c542','Tailor',2,6,'Measured',['Ivy','Arjun']]]
const kids=[['Mila','KG A','Red cape','Fitting'],['Theo','KG A','Red cape','At maker'],['Ava','KG A','Red cape','Ready'],['Ishan','KG A','Red cape','Measured'],['Zara','KG A','Gold sash','Issued'],['Kabir','KG A','Red cape','Needs fixing'],['Noor','KG B','Paper crown','At maker'],['Leo','KG B','Paper crown','Ready']]
const PATH=['Measured','At maker','Fitting','Ready','Issued']
function itemCard([ic,n,c,src,d,t,st,pend]){return `<div class="card">${`<div class="ph" style="background:color-mix(in srgb,${c} 30%,var(--s2))">${ic}</div>`}<div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:16px">${n}</b><span class="src">${src}</span></div><div style="color:var(--t3);font-size:12px;margin-top:2px">${d} / ${t} ready · ${st===`Ready`?'all done':'next: '+st}</div><div class="steps">${Array.from({length:t}).map((_,i)=>`<i style="${i<d?`background:var(--p)`:''}"></i>`).join('')}</div>${pend.length?`<div style="display:flex;margin-top:8px;align-items:center">${pend.map(p=>av(p,kids.find(k=>k[0]===p)?.[1]||'PREP A',24)).join('')}<span style="font-size:12px;color:var(--t3);margin-left:6px">pending</span></div>`:''}</div>${ring(d,t,d===t?'var(--p)':c,40)}</div>`}
function kidRow([n,s,it,st],open,bub){const nx=PATH[Math.min(PATH.indexOf(st)+1,4)]||'Ready'
 let o=`<div style="margin:0 14px 8px;border-radius:16px;background:${tint(st)};position:relative;${bub&&!open?'opacity:.3;filter:saturate(.3)':''};${open?`border:1px solid color-mix(in srgb,${ST[st]} 45%,transparent);z-index:5`:''}">`
 if(open&&bub) o+=`<div style="position:absolute;left:0;right:0;bottom:calc(100% + 6px);display:flex;justify-content:center;gap:10px;z-index:9">${[['📏','Too long','#5aa9ff'],['📐','Too short','#7ee0b5'],['🔘','Missing button','#f5b74e'],['🪡','Torn','#ff7a7a'],['🧺','Needs wash','#a78bfa'],['💬','Other','#8a93a8']].map(([e,l,c],i)=>`<div class="circ" style="transform:translateY(${[8,2,-3,-3,2,8][i]}px)"><div style="background:${c};width:52px;height:52px;box-shadow:0 10px 24px #000b,0 0 0 3px var(--bg)">${e}</div><span style="text-shadow:0 1px 4px #000">${l}</span></div>`).join('')}</div>`
 o+=`<div class="r" style="padding:12px">${av(n,s)}<div class="n"><b>${n} Sample</b><small>${it} · size M</small></div>${tag(st)}<span style="width:30px;text-align:center;color:var(--t2)">${open?'▴':'▾'}</span></div>`
 if(open) o+=`<div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${PATH.map(p=>pill(p,p===st)).join('')}${pill('Needs fixing',false)}<span style="margin-left:auto;color:var(--blue);font-size:13px;font-weight:600">Details ›</span></div><div class="in" style="${bub?'border:1.5px solid var(--blue);color:var(--t)':''}">${bub?'<span style="display:inline-block;width:2px;height:16px;background:var(--blue);vertical-align:middle"></span>':'Note…'}</div></div>`
 else if(!bub) o+=''
 return o+`</div>`}
function secH(s,m,t){return `<div class="sh">${ring(m,t,col[s])}<b>${s}</b><small>${m} / ${t} ready</small><span class="all">Advance all</span></div>`}
let h='',wideSplit=''
if(S==='1'){h=head(tog(1)+filt(['All 5','In progress 4','Ready 1','Tailor','Bought','Rented']));h+=`<div style="padding:0 18px 8px;color:var(--t3);font-size:12px">33 / 58 ready across 5 items</div>`;h+=W?`<div style="display:grid;grid-template-columns:1fr 1fr;padding:0 4px">${ITEMS.map(itemCard).join('')}<div class="card" style="border:1.5px dashed var(--line);background:transparent;justify-content:center;color:var(--t2);min-height:100px">＋ Add item</div></div>`:ITEMS.map(itemCard).join('')}
if(S==='2'||S==='3'){const bub=S==='3';h=head(tog(0)+filt(['All','Needs a step 5','Needs fixing 1','Ready 2']))+secH('KG A',1,6)+kids.slice(0,6).map(k=>kidRow(k,k[0]==='Ishan',bub)).join('')+(W?'':secH('KG B',1,2)+kids.slice(6).map(k=>kidRow(k,false,bub)).join(''));if(W)h=head(tog(0)+filt(['All','Needs a step 5','Needs fixing 1','Ready 2']))+`<div style="display:grid;grid-template-columns:1fr 1fr"><div>${secH('KG A',1,6)+kids.slice(0,6).map(k=>kidRow(k,k[0]==='Ishan',bub)).join('')}</div><div>${secH('KG B',1,2)+kids.slice(6).map(k=>kidRow(k,false,bub)).join('')}</div></div>`
 if(!bub)h+=`<div style="position:absolute;left:50%;transform:translateX(-50%);bottom:${W?24:88}px;background:var(--s2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:13px;z-index:8;white-space:nowrap;box-shadow:0 8px 24px #000a">Theo · At maker → Fitting <b style="color:var(--blue);margin-left:10px">Undo</b></div>`}
if(S==='4'){h=head(tog(1))+ITEMS.slice(0,3).map(itemCard).join('')+`<div class="scrim"></div><div class="sheet" style="top:${W?'0':'150px'}"><div class="grab"></div><div style="display:flex;gap:12px;align-items:center"><div class="ph" style="background:color-mix(in srgb,#e05a5a 30%,var(--s2))">🧥</div><div style="flex:1"><div style="font-size:19px;font-weight:650">Red cape</div><div style="color:var(--t3);font-size:13px">Source: Tailor · Assigned: Part “Chorus” (12)</div></div><span style="color:var(--blue);font-size:13px">Edit</span></div>
<div class="cap">Photos</div><div style="display:flex;gap:8px">${['#e05a5a','#c94a4a'].map(c=>`<div style="width:64px;height:64px;border-radius:12px;background:${c}"></div>`).join('')}<div style="width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--t3)">＋</div></div>
<div class="cap">Fields to show on this item</div>${[['Contact','Tailor-D · 98xxx xxx01',1],['Due date','15 Dec',1],['Cost','₹350 each',1],['Quantity','1 per child',0],['Notes','',1],['Size chart','',0],['Supplier link','',0]].map(([f,v,on])=>`<div class="fld"><span style="display:flex;gap:10px;align-items:center"><span class="cb ${on?'on':''}">${on?'✓':''}</span>${f}</span><span style="color:var(--t3)">${on?v:''}</span></div>`).join('')}<div style="color:var(--t3);font-size:12px">Only ticked fields appear on the item. Field names are editable in Terminology.</div></div>`}
if(S==='5'){h=head(tog(1))+`<div class="scrim"></div><div class="sheet" style="top:${W?'0':'90px'}"><div class="grab"></div><div style="display:flex;justify-content:space-between"><b style="font-size:18px">New item</b><span style="color:var(--t3)">2 of 3</span></div><div class="in" style="color:var(--t)">Red cape</div><div style="display:flex;gap:8px;align-items:center"><div style="width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--t3)">📷</div><span style="color:var(--t3);font-size:13px">Add photo (optional)</span><span style="margin-left:auto;display:flex;gap:6px">${['#e05a5a','#f5c542','#5aa9ff','#3ecf8e','#a78bfa'].map((c,i)=>`<i style="width:22px;height:22px;border-radius:50%;background:${c};${i?'':'box-shadow:0 0 0 2px #fff'}"></i>`).join('')}</span></div>
<div class="cap">Where does it come from?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:6px 0">${[['🛍️','Bought','#5aa9ff'],['🔁','Rented','#7ee0b5'],['🧵','Tailor','#f5b74e'],['🏠','Made at home','#ff8fb1'],['🏫','School store','#a78bfa'],['💬','Other','#8a93a8']].map(([e,l,c],i)=>`<div class="circ"><div style="background:${c};${i===2?'box-shadow:0 0 0 3px var(--s2),0 0 0 6px #fff':''}">${e}</div><span>${l}</span></div>`).join('')}</div>
<div class="cap">Steps for Tailor</div><div style="display:flex;gap:6px;flex-wrap:wrap">${['Measured','At maker','Fitting','Ready'].map(p=>pill(p,false)).join('')}<span style="color:var(--t3);font-size:12px;align-self:center">then Issued → Returned</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="color:var(--blue);font-size:13px">Just for one child (one-off)</span><span class="pill" style="background:var(--blue);color:#fff;padding:12px 22px;font-size:15px">Next: Assign ›</span></div></div>`}
if(S==='6'){h=`<div class="top"><div class="ib">‹</div><h1>Ishan Sample</h1><div class="ib">⋯</div></div><div style="display:flex;gap:14px;align-items:center;padding:4px 18px 14px">${av('Ishan','KG A',64)}<div><div style="font-size:15px">KG A · Chorus</div><div style="color:var(--t3);font-size:13px">Red cape · Measured</div></div></div>
<div class="seg"><span>Costumes</span><span class="on">Measurements</span><span>Photos</span></div>
<div style="margin:6px 14px 12px;border-radius:18px;background:var(--s1);padding:14px"><div style="display:flex;justify-content:space-between;align-items:center"><b>Latest</b><span style="color:var(--t3);font-size:13px">recorded 3 Nov 2026 · Ms. Sample</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px">${[['Chest','62','+2'],['Waist','56','+1'],['Length','78','+4'],['Shoulder','30','+1'],['Height','121','+5'],['Shoe','31','+1']].map(([k,v,d])=>`<div style="background:var(--s2);border-radius:12px;padding:10px"><div style="color:var(--t3);font-size:12px">${k}</div><div style="font-size:20px;font-weight:650">${v}<small style="font-size:12px;color:var(--t3)"> cm</small></div><div style="color:var(--p);font-size:12px">${d} since Jul</div></div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px"><span class="pill" style="background:var(--blue);color:#fff;padding:10px 16px">Re-measure</span><span class="pill" style="background:var(--s2);color:var(--t2);padding:10px 16px">＋ Field</span></div></div>
<div class="cap" style="padding:0 18px 8px">History · kept across events</div>${[['12 Jul 2026','Sports day','60 · 55 · 74 · 29 · 116'],['2 Feb 2026','Annual Day 2025','57 · 53 · 70 · 28 · 112'],['10 Aug 2025','Choir fest','55 · 52 · 67 · 27 · 109']].map(([d,e,v])=>`<div class="card" style="padding:12px 14px"><div style="flex:1"><b>${d}</b><div style="color:var(--t3);font-size:12px">${e}</div></div><span style="color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums">${v}</span><span style="color:var(--t3)">›</span></div>`).join('')}`}
if(S==='7'){h=head(tog(1))+`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px 120px;text-align:center"><div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--e) 40%,var(--s2)),var(--s1));display:grid;place-items:center;font-size:52px">🎭</div><div style="font-size:20px;font-weight:650">No items yet</div><div style="color:var(--t2);font-size:14px;max-width:320px">Add each costume once, then assign it to a part, a section or chosen children.</div><span class="pill" style="background:var(--blue);color:#fff;padding:14px 26px;font-size:16px">＋ Add your first item</span>
<div class="cap" style="margin-top:14px">or start from a template</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${['Choir · robe, sash','Play · per part','Dance · outfit, shoes','Copy from last event'].map(t=>`<span class="pill" style="background:var(--s1);color:var(--t2);padding:9px 14px;border:1px solid var(--line)">${t}</span>`).join('')}</div></div>`}
if(S==='8'){h=head(tog(1))+ITEMS.slice(0,2).map(itemCard).join('')+`<div class="scrim"></div><div class="sheet" style="top:${W?'0':'110px'}"><div class="grab"></div><b style="font-size:18px">Words for this event</b><div style="color:var(--t3);font-size:13px;margin-top:-6px">Annual Day · changes apply to this event only</div>
${[['Screen name','Costumes','Outfits'],['One item','Item',''],['Sources','Bought · Rented · Tailor · Made at home · School store · Other',''],['Tailor steps','Measured → At maker → Fitting → Ready',''],['Bought steps','Ordered → Arrived → Ready',''],['After-show','Issued → Returned · Needs fixing · Lost',''],['Field labels','Contact · Due date · Cost · Quantity · Notes','']].map(([k,v,n])=>`<div class="fld" style="flex-direction:column;align-items:stretch;gap:4px"><span style="color:var(--t3);font-size:12px">${k}</span><span style="display:flex;justify-content:space-between"><span>${n?`<s style="color:var(--t3)">${v}</s> <b style="color:var(--blue)">${n}</b>`:v}</span><span style="color:var(--t3)">✎</span></span></div>`).join('')}
<div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--t3);font-size:13px">Reset to defaults</span><span class="pill" style="background:var(--blue);color:#fff;padding:11px 20px">Save</span></div></div>`}
