<!doctype html><html data-theme="utopian-night"><head><meta charset="utf-8">
<link rel="stylesheet" href="kit/tokens.css"><link rel="stylesheet" href="kit/driftline.css">
<style>
/* Mock helpers: kit tokens only. GAP = not in kit v0.3.0. */
.pg{padding:var(--dl-space-5) var(--dl-space-4) calc(var(--dl-dock-height) + var(--dl-space-12));display:flex;flex-direction:column;gap:var(--dl-space-3);height:100vh;overflow:hidden}
.hd{display:flex;align-items:flex-end;gap:var(--dl-space-2);margin-bottom:var(--dl-space-1)}.hd>div{flex:1;min-width:0}
.vs{font-size:var(--dl-type-footnote-size);font-weight:600;color:var(--dl-color-text-muted);display:inline-flex;gap:4px;align-items:center;min-height:var(--dl-hit-min);padding:0 var(--dl-space-1)}
.vs b{color:var(--dl-color-accent);font-weight:600}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dl-dock{width:calc(100% - 24px)}.dl-dock__tab{flex:1;min-width:0;flex-direction:column;gap:2px;padding:4px 2px;font-size:var(--dl-type-caption-size)}
.ln{display:flex;align-items:center;gap:var(--dl-space-3);padding:var(--dl-space-3) var(--dl-pad);min-height:var(--dl-row);position:relative}
.ln+.ln::before{content:"";position:absolute;top:0;left:var(--dl-pad);right:0;height:1px;background:var(--dl-color-hairline)}
.no{width:22px;flex:none;color:var(--dl-color-text-faint);font-size:var(--dl-type-footnote-size);font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start;padding-top:2px}
.tx{flex:1;min-width:0}.tt{font-size:var(--dl-type-headline-size);line-height:var(--dl-type-headline-line);font-weight:600}
.mt{font-size:var(--dl-type-footnote-size);line-height:var(--dl-type-footnote-line);color:var(--dl-color-text-muted);margin-top:2px}
.dt{text-align:right;flex:none;font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted);font-variant-numeric:tabular-nums;line-height:var(--dl-type-footnote-line)}
.dt b{display:block;color:var(--dl-color-text);font-size:var(--dl-type-callout-size);font-weight:600}
.ok{color:var(--dl-color-positive)}
.faded{opacity:.5}
.sec{padding:var(--dl-space-2) var(--dl-space-1) 0}
/* GAP: avatar */ .av{width:36px;height:36px;border-radius:var(--dl-radius-pill);display:grid;place-items:center;font-size:var(--dl-type-footnote-size);font-weight:700;color:var(--dl-color-accent);background:var(--dl-chip-accent-bg);box-shadow:inset 0 0 0 1px var(--dl-chip-accent-border);flex:none}
.tc{padding:var(--dl-space-3) var(--dl-space-4)}.tc .h{display:flex;align-items:center;gap:var(--dl-space-3);margin-bottom:var(--dl-space-2)}
.tc .it{display:flex;justify-content:space-between;gap:var(--dl-space-3);padding:var(--dl-space-2) 0;font-size:var(--dl-type-callout-size)}
.tc .it span:last-child{color:var(--dl-color-text-muted);font-size:var(--dl-type-footnote-size);white-space:nowrap}
/* GAP: tile grid */ .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--dl-space-2)}
.tile{border-radius:var(--dl-radius-lg);padding:var(--dl-space-3) var(--dl-space-4);background:var(--dl-card-bg);box-shadow:inset 0 0 0 1px var(--dl-card-border),var(--dl-color-shadow-soft);min-height:112px;display:flex;flex-direction:column;gap:var(--dl-space-1);position:relative}
.tile .ic{width:36px;height:36px;border-radius:var(--dl-radius-sm);display:grid;place-items:center;color:var(--dl-color-accent);background:var(--dl-chip-accent-bg)}
.tile .nm{font-size:var(--dl-type-callout-size);line-height:var(--dl-type-callout-line);font-weight:600;flex:1;margin-top:var(--dl-space-1)}
.tile .who{font-size:var(--dl-type-caption-size);color:var(--dl-color-text-muted)}
.tile .tick{position:absolute;top:var(--dl-space-3);right:var(--dl-space-3);color:var(--dl-color-positive)}
.tile.on{box-shadow:inset 0 0 0 2px var(--dl-color-accent),var(--dl-color-shadow-soft)}
.dl-sheet{max-height:none}
.fr{display:flex;justify-content:space-between;align-items:center;gap:var(--dl-space-3);padding:var(--dl-space-3) var(--dl-pad);min-height:var(--dl-row);position:relative}
.fr+.fr::before{content:"";position:absolute;top:0;left:var(--dl-pad);right:0;height:1px;background:var(--dl-color-hairline)}
.fr>span:first-child{color:var(--dl-color-text-muted);font-size:var(--dl-type-callout-size)}
.fr>span:last-child{text-align:right;font-size:var(--dl-type-callout-size)}

.a1{display:flex;flex-direction:column;gap:var(--dl-space-2)}
.a1c{display:flex;gap:var(--dl-space-3);align-items:center;border-radius:var(--dl-radius-md);padding:var(--dl-space-3) var(--dl-space-4);background:var(--dl-card-bg);box-shadow:inset 0 0 0 1px var(--dl-card-border)}
.a1c .num{font-size:var(--dl-type-title3-size);font-weight:700;color:var(--dl-color-accent);width:24px;font-variant-numeric:tabular-nums;flex:none}
.th{display:flex;padding:var(--dl-space-2) var(--dl-pad);font-size:var(--dl-type-caption-size);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dl-color-text-faint)}
.tr{display:flex;gap:var(--dl-space-3);padding:var(--dl-space-3) var(--dl-pad);position:relative;align-items:flex-start}
.tr+.tr::before,.th+.tr::before{content:"";position:absolute;top:0;left:var(--dl-pad);right:var(--dl-pad);height:1px;background:var(--dl-color-hairline)}
.c1{flex:1.25;min-width:0}.c2{flex:1;min-width:0;font-size:var(--dl-type-footnote-size);line-height:var(--dl-type-footnote-line);color:var(--dl-color-text);padding-top:1px}
.th .c2{font-size:inherit;line-height:inherit;color:inherit;padding:0}.tk{width:18px;flex:none}
.c1 b{font-weight:600;font-size:var(--dl-type-callout-size);line-height:var(--dl-type-callout-line);display:block}.c1 small{font-size:var(--dl-type-caption-size);color:var(--dl-color-text-muted)}
.paper{border-radius:var(--dl-radius-lg);background:var(--dl-color-surface-raised);box-shadow:inset 0 0 0 1px var(--dl-color-hairline),var(--dl-color-shadow-soft);overflow:hidden}
.paper .ph{padding:var(--dl-space-3) var(--dl-pad);border-bottom:1px solid var(--dl-color-hairline)}
.paper .theme{font-size:var(--dl-type-title3-size);line-height:var(--dl-type-title3-line);font-weight:600;font-style:italic;margin-top:var(--dl-space-1)}
.paper .intro{display:flex;justify-content:space-between;gap:var(--dl-space-2);font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted);margin-top:var(--dl-space-2)}
.paper .intro span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper .fn{padding:var(--dl-space-3) var(--dl-pad);border-top:1px solid var(--dl-color-hairline);font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted)}
.cr{display:flex;align-items:center;gap:var(--dl-space-3);padding:0 var(--dl-pad);min-height:48px;position:relative}
.cr+.cr::before{content:"";position:absolute;top:0;left:calc(var(--dl-pad) + 34px);right:0;height:1px;background:var(--dl-color-hairline)}
.cr .no{padding:0;align-self:center}.cr .w{flex:1;font-size:var(--dl-type-callout-size);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr .ini{font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted);font-variant-numeric:tabular-nums}
.cr.on{background:var(--dl-chip-accent-bg)}
.tl{position:relative;padding-left:0}
.tli{display:flex;gap:var(--dl-space-3);align-items:flex-start;min-height:70px}
.tld{width:58px;text-align:right;flex:none;font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tlr{width:16px;flex:none;align-self:stretch;position:relative;display:flex;justify-content:center}
.tlr::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--dl-color-hairline)}
.tli:first-child .tlr::before{top:8px}.tli:last-child .tlr::before{bottom:auto;height:8px}
.tlr i{position:relative;margin-top:4px;width:14px;height:14px;border-radius:50%;background:var(--dl-color-bg);box-shadow:inset 0 0 0 2px var(--dl-color-accent)}
.tlr i.done{background:var(--dl-color-positive);box-shadow:0 0 0 3px color-mix(in srgb,var(--dl-color-positive) 22%,transparent)}
.tlt{flex:1;min-width:0;padding-bottom:var(--dl-space-3)}.tlt b{display:block;font-weight:600;font-size:var(--dl-type-callout-size);line-height:var(--dl-type-callout-line)}.tlt small{font-size:var(--dl-type-footnote-size);color:var(--dl-color-text-muted)}
</style></head><body><div id="m"></div><script>
const V=new URLSearchParams(location.search).get('v')
const I={ // simple line icons (Lucide-style paths)
today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
show:'<path d="M4 4h16v10a8 8 0 0 1-16 0z"/><path d="M9 9h.01M15 9h.01M9 14c1.5 1.5 4.5 1.5 6 0"/>',
plan:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 14h4M7 17h7"/>',
members:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2A5 5 0 0 1 21.5 19"/>',
notes:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',
check:'<path d="M20 6 9 17l-5-5"/>',chev:'<path d="m6 9 6 6 6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
reception:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10M10 20v-6h4v6"/>',
backscreen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
seating:'<path d="M6 19v-3M18 19v-3M5 16h14l-1-6H6z"/><path d="M7 10V5h10v5"/>',
sound:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
photo:'<path d="M3 8a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/>',
deco:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
stage:'<path d="M3 3h18M4 3v18M20 3v18M4 3c0 6 3 9 6 10M20 3c0 6-3 9-6 10M2 21h20"/>',
parking:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',
food:'<path d="M4 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M6 13v8M17 21V3c-2 0-4 2-4 6s2 4 4 4"/>'}
const ic=(k,s=20)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${I[k]}</svg>`
// Notice 3 structure, generic names. All "24 Aug" in the notice; some varied for option B grouping.
const D=[['Reception (Inauguration / Invitation)',['A','B'],'Fri 21 Aug',2,'reception',0],
['Backscreen',['C'],'Mon 24 Aug',5,'backscreen',1],
['Seating Arrangement',['D','E'],'Mon 24 Aug',5,'seating',0],
['Sound & Light',['F'],'Fri 21 Aug',2,'sound',0],
['PR / Photography',['G','A'],'Mon 24 Aug',5,'photo',0],
['Hall Decoration',['H','C'],'Fri 28 Aug',9,'deco',0],
['Stage Co-ordination',['B'],'Mon 24 Aug',5,'stage',0],
['Parking',['E'],'Mon 24 Aug',5,'parking',1],
['Refreshment',['D','H'],'Fri 4 Sep',16,'food',0]]
const T=k=>'Teacher '+k, Ts=a=>a.map(T).join(' · ')
const dock=`<nav class="dl-dock">${[['today','Today'],['show','Show'],['plan','Plan'],['members','Members'],['notes','Notes']].map(([i,l])=>`<button class="dl-dock__tab${l=='Plan'?' is-on':''}">${l=='Plan'?'<span class="dl-dock__pill"></span>':''}<span class="dl-dock__icon">${ic(i)}</span><span class="dl-dock__label">${l}</span></button>`).join('')}</nav>`
const hdr=view=>`<div class="hd"><div><div class="dl-eyebrow">Parents' Day 2027</div><h1 class="dl-title2" style="margin-top:2px">Duties &amp; Responsibilities</h1></div><button class="dl-iconbtn">${ic('search')}</button><button class="dl-iconbtn">${ic('plus')}</button></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:-6px 0 0"><span class="dl-muted" style="font-size:var(--dl-type-footnote-size)">Notice 3 · 9 duties</span><button class="vs">View: <b>${view}</b>${ic('chev',14)}</button></div>`
const short=d=>d.replace(/^\w+ /,'')
let h='<div class="pg">'
if(V=='A'){h+=hdr('Notice')+`<div class="dl-list">${D.map((d,i)=>`<div class="ln"><span class="no">${i+1}</span><div class="tx"><div class="tt">${d[0]}</div><div class="mt">${Ts(d[1])}</div></div><div class="dt">${d[5]?`<span class="ok">${ic('check',18)}</span>`:`<span style="font-size:var(--dl-type-caption-size)">by</span><b>${short(d[2])}</b>`}</div></div>`).join('')}</div>`}
if(V=='B'){h+=hdr('By date');const open=D.filter(d=>!d[5]),G=[['This week',open.filter(d=>d[3]<=4)],['Next week',open.filter(d=>d[3]>4&&d[3]<=11).sort((a,b)=>a[3]-b[3])],['Later',open.filter(d=>d[3]>11)]]
for(const [g,ds] of G)h+=`<div class="dl-eyebrow sec">${g}</div><div class="dl-list">${ds.map(d=>`<div class="ln"><div class="tx"><div class="tt">${d[0]}</div><div class="mt">${Ts(d[1])}</div></div><div class="dt"><b${d[3]<=2?' style="color:var(--dl-color-warning)"':''}>in ${d[3]} days</b>${d[2]}</div></div>`).join('')}</div>`
h+=`<div class="dl-eyebrow sec">Approved</div><div class="dl-list faded">${D.filter(d=>d[5]).map(d=>`<div class="ln"><div class="tx"><div class="tt">${d[0]}</div><div class="mt">${Ts(d[1])}</div></div><span class="ok">${ic('check',18)}</span></div>`).join('')}</div>`}
if(V=='C'){h+=hdr('By teacher');const by={};D.forEach(d=>d[1].forEach(k=>(by[k]=by[k]||[]).push(d)))
h+=`<div style="display:flex;flex-direction:column;gap:var(--dl-space-3)">${Object.keys(by).sort().slice(0,4).map(k=>`<section class="dl-card dl-card--glass tc"><div class="h"><span class="av">T${k}</span><span class="dl-headline">${T(k)}</span></div>${by[k].map(d=>`<div class="it"><span>${d[0]}</span><span>${d[5]?'<b style="color:var(--dl-color-positive);font-weight:600">Approved</b>':'by '+short(d[2])}</span></div>`).join('')}</section>`).join('')}<div class="dl-muted" style="font-size:var(--dl-type-footnote-size);text-align:center">Teacher E – Teacher H below</div></div>`}
if(V=='D'||V=='DS'){h+=hdr('Tiles')+`<div class="grid">${D.map((d,i)=>`<div class="tile${V=='DS'&&i==0?' on':''}"><span class="ic">${ic(d[4])}</span>${d[5]?`<span class="tick">${ic('check',18)}</span>`:''}<div class="nm">${d[0].replace(' (Inauguration / Invitation)','')}</div><div class="who">${d[1].map(k=>'T'+k).join(' · ')} · by ${short(d[2])}</div></div>`).join('')}</div>`}
const appr=d=>d[5]?`<span class="ok">${ic('check',18)}</span>`:''
if(V=='A1'){h+=hdr('Notice · Cards')+`<div class="a1">${D.map((d,i)=>`<div class="a1c"><span class="num">${i+1}</span><div class="tx"><div class="tt">${d[0]}</div><div class="mt">${Ts(d[1])}</div></div><div class="dt">${d[5]?appr(d):`<span style="font-size:var(--dl-type-caption-size)">by</span><b>${short(d[2])}</b>`}</div></div>`).join('')}</div>`}
if(V=='A2'){h+=hdr('Notice · Table')+`<div class="dl-list"><div class="th"><span class="c1">Nature of Work</span><span class="c2">Teacher In-charge</span><span class="tk"></span></div>${D.map((d,i)=>`<div class="tr"><div class="c1"><b>${d[0]}</b><small>Approval on/before ${short(d[2])}</small></div><div class="c2">${d[1].map(T).join('<br>')}</div><span class="tk">${appr(d)}</span></div>`).join('')}</div>`}
if(V=='A3'){h+=hdr('Notice · Sheet').replace('Notice 3 · 9 duties','As sent')+`<div class="paper"><div class="ph"><div class="dl-eyebrow">Notice 3 · 3 Aug 26</div><div class="theme">Tiny Feet, Boundless Leaps</div><div class="intro"><span>Dear Teachers, the following duties are assigned for Parents' Day…</span><span style="color:var(--dl-color-accent);flex:none">More</span></div></div>
<div class="th"><span class="c1">Nature of Work</span><span class="c2">Teacher In-charge</span></div>${D.map((d,i)=>`<div class="tr" style="padding-top:6px;padding-bottom:6px"><div class="c1"><b>${i+1}. ${d[0]}</b><small>by ${short(d[2])}</small></div><div class="c2">${d[1].map(T).join('<br>')}</div></div>`).join('')}
<div class="fn">Practice for cultural items begins Tue 1 Sep</div></div>`}
if(V=='A4'||V=='A4P'){h+=hdr('Notice · Compact')+`<div class="dl-list">${D.map((d,i)=>`<div class="cr${V=='A4P'&&i==3?' on':''}"><span class="no">${i+1}</span><span class="w">${d[0]}</span><span class="ini">${d[1].map(k=>'T'+k).join(' · ')}</span>${d[5]?appr(d):'<span style="width:18px"></span>'}</div>`).join('')}</div>`}
if(V=='A5'){h+=hdr('Notice · Timeline')+`<div class="tl">${D.map((d,i)=>`<div class="tli"><div class="tld">${short(d[2])}</div><div class="tlr"><i class="${d[5]?'done':''}"></i></div><div class="tlt"><b>${i+1}. ${d[0]}</b><small>${Ts(d[1])}${d[5]?' · <span class="ok">Approved</span>':''}</small></div></div>`).join('')}</div>`}
h+='</div>'+dock
if(V=='A4P'){const d=D[3];h+=`<div class="dl-scrim" style="background:transparent"></div><div class="dl-sheet"><div class="dl-sheet__grab"></div>
<header class="dl-sheet__head"><div><div class="dl-eyebrow">4 · Nature of Work</div><h2>Sound &amp; Light</h2></div><button class="dl-iconbtn">${ic('x',18)}</button></header>
<div class="dl-sheet__body" style="display:flex;flex-direction:column;gap:var(--dl-space-3)">
<div class="dl-list"><div class="fr"><span>Teacher In-charge</span><span>Teacher F</span></div><div class="fr"><span>Approval on/before</span><span>Fri 21 Aug · <span style="color:var(--dl-color-warning)">in 2 days</span></span></div><div class="fr"><span>Notes</span><span class="dl-muted">Mic list from stage team</span></div></div>
</div><footer class="dl-sheet__foot" style="padding-bottom:var(--dl-space-8)"><button class="dl-btn dl-btn--secondary dl-btn--lg">Add note</button><button class="dl-btn dl-btn--primary dl-btn--lg">${ic('check',18)} Approve</button></footer></div>`}
if(V=='DS'){const d=D[0];h+=`<div class="dl-scrim"></div><div class="dl-sheet"><div class="dl-sheet__grab"></div>
<header class="dl-sheet__head"><div style="display:flex;gap:var(--dl-space-3);align-items:center"><span class="tile" style="all:unset"><span style="width:40px;height:40px;border-radius:var(--dl-radius-sm);display:grid;place-items:center;color:var(--dl-color-accent);background:var(--dl-chip-accent-bg)">${ic('reception',22)}</span></span><div><div class="dl-eyebrow">Nature of Work</div><h2>Reception</h2></div></div><button class="dl-iconbtn">${ic('x',18)}</button></header>
<div class="dl-sheet__body" style="display:flex;flex-direction:column;gap:var(--dl-space-4)">
<div class="dl-muted" style="font-size:var(--dl-type-callout-size)">Inauguration and invitation</div>
<div class="dl-list"><div class="fr"><span>Teacher(s) In-charge</span><span>Teacher A<br>Teacher B</span></div><div class="fr"><span>Approval on/before</span><span>Fri 21 Aug<br><span style="color:var(--dl-color-warning);font-size:var(--dl-type-footnote-size)">in 2 days</span></span></div><div class="fr"><span>Status</span><span>Not yet approved</span></div></div>
<div class="dl-list"><div class="fr"><span>Work Status Report</span><span class="dl-muted">None yet</span></div><div class="fr"><span>More options</span><span class="dl-muted">›</span></div></div>
</div><footer class="dl-sheet__foot" style="padding-bottom:var(--dl-space-8)"><button class="dl-btn dl-btn--secondary dl-btn--lg">Add report</button><button class="dl-btn dl-btn--primary dl-btn--lg">Mark approved</button></footer></div>`}
document.getElementById('m').innerHTML=h
</script></body></html>
